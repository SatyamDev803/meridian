# One web service (bot + API + dashboard) and a small Postgres for fills and events.
# Singapore keeps us close to Delta India and avoids Binance's US block.
services:
  - type: web
    name: meridian
    runtime: docker
    plan: starter # free instances sleep when idle, which would stop the bot mid-demo
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: CONTROL_API_KEY
        generateValue: true
      - key: AUTO_START
        value: "false"
      - key: CHAOS_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: '[]'
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString

databases:
  - name: meridian-db
    plan: free
    region: singapore
